name: 刷课
on:
  push:
    branches: [ main ]

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v3

      - name: 设置python环境
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install httpx urllib3

      - name: Run main.py
        run: python main.py -u 17303757921 -p 20070128xX -l 265891345
